name: Keep Streamlit Apps Awake
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: pip install selenium webdriver-manager
      - name: Install Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
      - name: Wake all apps
        env:
          STREAMLIT_URL_1: ${{ secrets.STREAMLIT_URL_1 }}
          STREAMLIT_URL_2: ${{ secrets.STREAMLIT_URL_2 }}
          STREAMLIT_URL_3: ${{ secrets.STREAMLIT_URL_3 }}
          STREAMLIT_URL_3: ${{ secrets.STREAMLIT_URL_4 }}
          STREAMLIT_URL_3: ${{ secrets.STREAMLIT_URL_5 }}
        run: |
          for url in "$STREAMLIT_URL_1" "$STREAMLIT_URL_2" "$STREAMLIT_URL_3"; do
            if [ -n "$url" ]; then
              echo "🚀 Waking: $url"
              STREAMLIT_URL="$url" python .github/scripts/wake_app.py || echo "⚠️ Failed for $url, continuing..."
            fi
          done
